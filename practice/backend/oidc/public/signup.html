<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0a0a0a;
        color: #f5f5f5;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .signup-card {
        width: 100%;
        max-width: 420px;
        padding: 32px;
        background: #111;
        border: 1px solid #242424;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        letter-spacing: -0.5px;
      }

      .subtitle {
        margin: 0 0 28px;
        color: #888;
        font-size: 14px;
      }

      .form-group {
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 7px;
        color: #ccc;
        font-size: 13px;
        font-weight: 500;
      }

      input {
        width: 100%;
        padding: 12px 13px;
        border: 1px solid #2b2b2b;
        border-radius: 9px;
        outline: none;
        background: #0c0c0c;
        color: #fff;
        font-size: 14px;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      input::placeholder {
        color: #555;
      }

      input:focus {
        border-color: #666;
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
      }

      button {
        width: 100%;
        margin-top: 6px;
        padding: 12px;
        border: 0;
        border-radius: 9px;
        background: #fff;
        color: #000;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition:
          opacity 0.2s,
          transform 0.2s;
      }

      button:hover {
        opacity: 0.9;
      }

      button:active {
        transform: scale(0.98);
      }

      .footer {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid #222;
        text-align: center;
        color: #777;
        font-size: 13px;
      }

      .footer a {
        color: #fff;
        font-weight: 500;
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .footer a:hover {
        color: #aaa;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .error-msg,
      .success-msg {
        margin-bottom: 16px;
        font-size: 13px;
      }

      .error-msg {
        color: #ff6b6b;
      }

      .success-msg {
        color: #6ee7b7;
      }

      @media (max-width: 480px) {
        .signup-card {
          padding: 24px;
        }
      }
    </style>
  </head>

  <body>
    <main class="signup-card">
      <h1>Create an account</h1>
      <p class="subtitle">Enter your details to get started.</p>

      <form novalidate id="signup-form">
        <div id="errorMsg" class="error-msg" role="alert"></div>
        <div id="successMsg" class="success-msg" role="status"></div>

        <div class="form-group">
          <label for="name">Name</label>
          <input
            id="name"
            name="name"
            type="text"
            placeholder="Your name"
            autocomplete="name"
          />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="••••••••"
            autocomplete="new-password"
          />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            placeholder="••••••••"
            autocomplete="new-password"
          />
        </div>

        <button type="submit" id="submitBtn">Create account</button>
      </form>
      <div class="footer">
        Already have an account? <a href="/o/authenticate">Sign in</a>
      </div>
    </main>
  </body>
  <script type="module">
    const form = document.getElementById("signup-form");
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const successMsg = document.getElementById("successMsg");
    const errorMsg = document.getElementById("errorMsg");
    const submitBtn = document.getElementById("submitBtn");

    const params = new URLSearchParams(window.location.search);

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = "block";
      successMsg.style.display = "none";
    }

    function showSuccess(msg) {
      successMsg.textContent = msg;
      successMsg.style.display = "block";
      errorMsg.style.display = "none";
    }

    function hideMessages() {
      errorMsg.style.display = "none";
      successMsg.style.display = "none";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideMessages();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (!name || !email || !password || !confirmPassword) {
        showError("Please fill all fields");
        return;
      }

      if (password.length < 8) {
        showError("Password must be 8 characters long");
        return;
      }

      if (password !== confirmPassword) {
        showError("Password and confirm password do not match");
        return;
      }

      try {
        const res = await fetch("/o/authenticate/sign-up", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name,
            email,
            password,
          }),
        });

        const data = await res.json().catch(() => {});

        if (!res.ok) {
          showError(data.message || "Something went wrong!");
        } else if (data.redirect) {
          window.location.href = data.redirect;
        } else {
          showSuccess(data.message || "Account created redirecting...");
          setTimeout(() => {
            window.location.href = `/o/authenticate${window.location.search}`;
          }, 1500);
        }
      } catch (error) {
        showError("Something went wrong! try after some time.");
      }
    });
  </script>
</html>
