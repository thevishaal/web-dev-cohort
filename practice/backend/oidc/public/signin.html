<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />

    <title>Sign In | OIDC AUTH</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0a0a0a;
        color: #f5f5f5;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .auth-card {
        width: 100%;
        max-width: 400px;
        padding: 32px;
        background: #111;
        border: 1px solid #242424;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }

      h1 {
        margin: 0 0 28px;
        font-size: 26px;
        line-height: 1.2;
        letter-spacing: -0.5px;
      }

      .form-group {
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 7px;
        color: #ccc;
        font-size: 13px;
        font-weight: 500;
      }

      input {
        width: 100%;
        padding: 12px 13px;
        border: 1px solid #2b2b2b;
        border-radius: 9px;
        outline: none;
        background: #0c0c0c;
        color: #fff;
        font-size: 14px;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      input::placeholder {
        color: #555;
      }

      input:focus {
        border-color: #666;
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
      }

      button {
        width: 100%;
        margin-top: 6px;
        padding: 12px;
        border: 0;
        border-radius: 9px;
        background: #fff;
        color: #000;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition:
          opacity 0.2s,
          transform 0.2s;
      }

      button:hover {
        opacity: 0.9;
      }

      button:active {
        transform: scale(0.98);
      }

      .error-msg,
      .success-msg {
        margin-bottom: 16px;
        font-size: 13px;
      }

      .error-msg {
        color: #ff6b6b;
      }

      .success-msg {
        color: #6ee7b7;
      }

      .footer {
        margin-top: 24px;
        text-align: center;
        color: #777;
        font-size: 13px;
      }

      .footer a {
        color: #fff;
        text-decoration: none;
        font-weight: 500;
      }

      .footer a:hover {
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      @media (max-width: 480px) {
        .auth-card {
          padding: 24px;
        }

        h1 {
          font-size: 24px;
        }
      }
    </style>
  </head>

  <body>
    <main class="auth-card">
      <h1>Welcome back to OIDC AUTH</h1>

      <form id="form" novalidate>
        <div id="errorMsg" class="error-msg" role="alert"></div>
        <div id="successMsg" class="success-msg" role="status"></div>
        <div class="form-group">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
        </div>

        <button id="submitBtn" type="submit">Sign In</button>
      </form>

      <div class="footer">
        Don't have an account?
        <a href="/o/authenticate/sign-up">Create account</a>
      </div>
    </main>
  </body>
  <script>
    const form = document.getElementById("form");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const btn = document.getElementById("submitBtn");
    const errorMsg = document.getElementById("errorMsg");
    const submitBtn = document.getElementById("submitBtn");

    const params = new URLSearchParams(window.location.search);

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = "block";
      successMsg.style.display = "none";
    }

    function showSuccess(msg) {
      successMsg.textContent = msg;
      successMsg.style.display = "block";
      errorMsg.style.display = "none";
    }

    function hideMessages() {
      errorMsg.style.display = "none";
      successMsg.style.display = "none";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideMessages();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showError("Please fill all the field");
        return;
      }

      try {
        const res = await fetch("/o/authenticate/sign-in", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email,
            password,
          }),
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.message || "Something went wrong");
        } else {
          showSuccess(data.message || "User signin successfully");
          setTimeout(() => {
            window.location.href = `/o/authenticate${window.location.search}`;
          }, 1500);
        }
      } catch (error) {
        showError("Something went wrong! try after some time.");
      }
    });
  </script>
</html>
