<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unauthorized Client — OIDC Auth</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        color-scheme: dark;
        --bg: #09090b;
        --surface: #111113;
        --border: #27272a;
        --text: #f4f4f5;
        --muted: #a1a1aa;
        --danger: #f87171;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .card {
        width: 100%;
        max-width: 420px;
        padding: 32px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      .icon {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        margin: 0 auto 20px;
        border: 1px solid rgba(248, 113, 113, 0.2);
        border-radius: 12px;
        background: rgba(248, 113, 113, 0.08);
        color: var(--danger);
        font-size: 20px;
        font-weight: 600;
      }

      h1 {
        margin-bottom: 10px;
        font-size: 24px;
        line-height: 1.2;
        font-weight: 500;
        letter-spacing: -0.025em;
      }

      .message {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .client {
        margin-top: 18px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #0d0d0f;
        color: var(--text);
        font-size: 13px;
        word-break: break-all;
      }

      .label {
        display: block;
        margin-bottom: 5px;
        color: #71717a;
        font-size: 11px;
      }

      .footer {
        margin-top: 24px;
        color: #52525b;
        font-size: 11px;
      }

      @media (max-width: 480px) {
        .card {
          padding: 26px 22px;
        }
      }
    </style>
  </head>

  <body>
    <main class="card">
      <div class="icon">!</div>

      <h1>Unauthorized Client</h1>

      <p class="message">
        This application is not authorized to use OIDC Auth. Please contact the
        application administrator.
      </p>
      <div class="footer">OIDC Auth</div>
    </main>
  </body>
</html>
